/* ─── HOOKS ─────────────────────────────────────────────────────── */
function useTypewriter(words){
  const [text,setText]=useState("");
  const [wi,setWi]=useState(0);
  const [del,setDel]=useState(false);
  useEffect(()=>{
    const w=words[wi];
    let t;
    if(!del){
      if(text.length<w.length) t=setTimeout(()=>setText(w.slice(0,text.length+1)),72);
      else t=setTimeout(()=>setDel(true),2200);
    } else {
      if(text.length>0) t=setTimeout(()=>setText(w.slice(0,text.length-1)),36);
      else{setDel(false);setWi(p=>(p+1)%words.length);}
    }
    return()=>clearTimeout(t);
  },[text,wi,del,words]);
  return text;
}

function useFadeIn(){
  const ref=useRef(null);
  const [vis,setVis]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting)setVis(true);},{threshold:.1});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  return[ref,vis];
}

/* ─── SCROLL PROGRESS BAR ───────────────────────────────────────── */
function ScrollBar(){
  const [pct,setPct]=useState(0);
  useEffect(()=>{
    const h=()=>{const el=document.documentElement;setPct(Math.round((window.scrollY/(el.scrollHeight-el.clientHeight))*100));};
    window.addEventListener('scroll',h,{passive:true});
    return()=>window.removeEventListener('scroll',h);
  },[]);
  return <div style={{position:'fixed',top:0,left:0,height:3,width:pct+'%',background:'linear-gradient(90deg,#8B5CFF,#0D9488)',zIndex:300,transition:'width .1s linear'}}/>;
}

        <span style={{fontSize:'.78rem',color:'var(--muted)'}}>{p.period}</span>
      </div>
      <div style={{padding:'22px 24px',flex:1,display:'flex',flexDirection:'column'}}>
        <p style={{fontSize:'.88rem',color:'var(--sub)',lineHeight:1.8,marginBottom:18,flex:1}}>{p.desc}</p>

/* ─── IN-PROGRESS CARD ──────────────────────────────────────────── */
function InProgressCard({p}){
  const [r,vis]=useFadeIn();
  const isUpcoming = p.status === 'upcoming';
  const cardStyle = isUpcoming
    ? {background:'var(--white)',border:'1px solid #D4BCFF',borderLeft:'4px solid #8B5CFF',borderRadius:14,boxShadow:'var(--sh)',overflow:'hidden',display:'flex',flexDirection:'column'}
    : {background:'var(--white)',border:'1px solid #FDE68A',borderLeft:'4px solid #F59E0B',borderRadius:14,boxShadow:'var(--sh)',overflow:'hidden',display:'flex',flexDirection:'column'};
  const headStyle = isUpcoming
    ? {padding:'22px 24px',borderBottom:'1px solid #EDE9FE',background:'#F5F3FF'}
    : {padding:'22px 24px',borderBottom:'1px solid #FEF3C7',background:'#FFFBEB'};
  return(
    <div ref={r} className={`fi${vis?' on':''}`} style={cardStyle}>
      <div style={headStyle}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          {isUpcoming ? (
            <>
              <span style={{fontSize:'.67rem',fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',padding:'4px 10px',borderRadius:4,background:'#EDE9FE',color:'#5B21B6',border:'1px solid #C4B5FD'}}>Upcoming Pipeline</span>
              <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:'.75rem',color:'#7C3AED',fontWeight:500}}>
                ✦ AI in Healthcare Series
              </span>
            </>
          ) : (
            <>
              <span style={{fontSize:'.67rem',fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',padding:'4px 10px',borderRadius:4,background:'#FEF3C7',color:'#92400E',border:'1px solid #FDE68A'}}>In Progress</span>
              <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:'.75rem',color:'#B45309',fontWeight:500}}>
                <span style={{width:7,height:7,borderRadius:'50%',background:'#F59E0B',display:'inline-block',animation:'blink 1.4s ease infinite'}}/>
                Currently Building
              </span>
            </>
          )}
        </div>
        <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:'1.35rem',fontWeight:400,color:'var(--navy)',marginBottom:4}}>{p.title}</h3>
        <span style={{fontSize:'.78rem',color:'var(--muted)'}}>{p.period}</span>
      </div>
      <div style={{padding:'22px 24px',flex:1,display:'flex',flexDirection:'column'}}>
        <p style={{fontSize:'.88rem',color:'var(--sub)',lineHeight:1.8,marginBottom:18,flex:1}}>{p.desc}</p>
        <div style={{fontSize:'.67rem',fontWeight:700,letterSpacing:'.16em',textTransform:'uppercase',color:'var(--muted)',marginBottom:10}}>
          {isUpcoming ? 'Planned Stack' : 'Planned Stack'}
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {p.stack.map((t,i)=><Tag key={i} teal={i<2}>{t}</Tag>)}
        </div>
      </div>
    </div>
  );
}

/* ─── BACK TO TOP ───────────────────────────────────────────────── */
function BackToTop(){
  const [show,setShow]=useState(false);
  useEffect(()=>{
    const h=()=>setShow(window.scrollY>500);
    window.addEventListener('scroll',h,{passive:true});
    return()=>window.removeEventListener('scroll',h);
  },[]);
  if(!show)return null;
  return <button
    style={{position:'fixed',bottom:28,right:28,width:44,height:44,borderRadius:'50%',background:'#8B5CFF',color:'#fff',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.1rem',boxShadow:'0 4px 16px rgba(165,129,255,.4)',zIndex:150}}
    onClick={()=>window.scrollTo({top:0,behavior:'smooth'})} aria-label="Back to top">↑</button>;
}

function ResponsiveStyles(){

    .proj-body{display:grid;grid-template-columns:1fr 1fr;gap:30px}
    .desktop-nav{display:flex}
    @media(max-width:860px){
      .hide-mobile{display:none!important}
      .proj-body{grid-template-columns:1fr!important}
    }
    @media(max-width:700px){
      .proj-grid{grid-template-columns:1fr!important}
    }
    @media(max-width:540px){
      .desktop-nav{display:none!important}
    }
  `}</style>;
}
